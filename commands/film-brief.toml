description = "Start an AI film production: detect the project type, run the 5-question brief, open the Production Bible"
prompt = """
Use the ai-filmmaker skill and act as director, cinematographer, editor and prompt engineer.

Start a new production from Stage 1:
1. Read the request below and state the project type (cinematic / ugc-persona / product-commercial, or the nearest one) and the entry point in one line.
